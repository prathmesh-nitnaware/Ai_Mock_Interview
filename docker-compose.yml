services:
  # ── EDGE LOAD BALANCER ──────────────────────────────────────────────────────
  load_balancer:
    image: nginx:alpine
    container_name: prepai_load_balancer
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend_1
      - backend_2
      - backend_3
      - frontend
    networks:
      - prepai_net

  # ── BACKEND CLUSTER INSTANCE 1 ──────────────────────────────────────────────
  backend_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prepai_backend_1
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ID=backend_1
    env_file:
      - ./backend/.env
    networks:
      - prepai_net

  # ── BACKEND CLUSTER INSTANCE 2 ──────────────────────────────────────────────
  backend_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prepai_backend_2
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ID=backend_2
    env_file:
      - ./backend/.env
    networks:
      - prepai_net

  # ── BACKEND CLUSTER INSTANCE 3 ──────────────────────────────────────────────
  backend_3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prepai_backend_3
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ID=backend_3
    env_file:
      - ./backend/.env
    networks:
      - prepai_net

  # ── FRONTEND CLIENT ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prepai_frontend
    restart: unless-stopped
    networks:
      - prepai_net

networks:
  prepai_net:
    driver: bridge
