# ==============================================================================
# NGINX REVERSE PROXY & LOAD BALANCER CONFIGURATION — PrepAI
# ==============================================================================
# Features:
# 1. Upstream cluster with Least-Connections (least_conn) load balancing algorithm
# 2. Passive health checks & automatic node failover (max_fails=3 fail_timeout=10s)
# 3. Full WebSocket support for live audio/speech interviews (Connection Upgrade map)
# 4. Gzip compression & buffer optimizations
# 5. Security & Rate-Limit zone
# 6. Production Security Headers & server_tokens off
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Security: Hide Nginx version
    server_tokens off;

    # Logging format with upstream timing
    log_format loadbalancer '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent" '
                            'upstream: $upstream_addr '
                            'response_time: $upstream_response_time s';

    access_log /var/log/nginx/access.log loadbalancer;
    error_log  /var/log/nginx/error.log warn;

    # Performance optimizations
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 15M; # Limit max upload size

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml font/woff2;

    # WebSocket upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── UPSTREAM BACKEND CLUSTER ───────────────────────────────────────────────
    upstream prepai_backend_cluster {
        least_conn;

        server backend_1:5000 max_fails=3 fail_timeout=10s weight=1;
        server backend_2:5000 max_fails=3 fail_timeout=10s weight=1;
        server backend_3:5000 max_fails=3 fail_timeout=10s weight=1;

        keepalive 32;
    }

    # ── UPSTREAM FRONTEND CLUSTER ──────────────────────────────────────────────
    upstream prepai_frontend {
        server frontend:80;
    }

    # ── RATE LIMITING ZONE ─────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # ── MAIN LOAD BALANCER SERVER BLOCK ────────────────────────────────────────
    server {
        listen 80;
        server_name localhost prepai.local;

        # ── GLOBAL SECURITY HEADERS ────────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

        # ── LET'S ENCRYPT ACME CHALLENGE ───────────────────────────────────────
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # ── API & BACKEND ROUTING (Load Balanced) ──────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://prepai_backend_cluster;
            proxy_http_version 1.1;

            # Upstream headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket upgrade headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Fast connection timeout & transparent failover to next backend
            proxy_connect_timeout 2s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;

            # Automatic failover across upstream nodes
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;

            # Buffer sizing
            proxy_buffering on;
            proxy_buffer_size 16k;
            proxy_buffers 4 32k;
        }

        # ── WEBSOCKET INTERVIEW SOCKETS (Dedicated proxy) ──────────────────────
        location /sock/ {
            proxy_pass http://prepai_backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── DIAGNOSTIC LOAD BALANCER TEST ENDPOINT ─────────────────────────────
        location /lb-test {
            proxy_pass http://prepai_backend_cluster/api/lb-test;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout invalid_header http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # ── LOAD BALANCER HEALTH CHECK ────────────────────────────────────────
        location /lb-health {
            access_log off;
            return 200 '{"status":"healthy","load_balancer":"nginx","algorithm":"least_conn"}';
            add_header Content-Type application/json;
        }

        # ── FRONTEND ROUTING ──────────────────────────────────────────────────
        location / {
            proxy_pass http://prepai_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
